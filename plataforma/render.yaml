services:
  - type: web
    name: prospectaradar
    runtime: python
    rootDir: plataforma
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: seu@email.com
      - key: ADMIN_SENHA
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_SUPORTE
        value: "5541999999999"
