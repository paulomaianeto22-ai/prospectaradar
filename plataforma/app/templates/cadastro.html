{% extends "base.html" %}{% block conteudo %}
<div class="card" style="max-width:460px;margin:40px auto">
<h1>Criar conta</h1><p class="sub">Cadastre-se e ganhe 25 leads grátis.</p>
{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
<form method="post">
<label>Nome</label><input name="nome" required>
<label>Email</label><input name="email" type="email" required>
<label>Senha</label><input name="senha" type="password" required>
<button class="btn" style="width:100%">Criar conta</button></form>
<p style="margin-top:16px">Já tem conta? <a class="link" href="/login">Entrar</a></p>
</div>{% endblock %}
