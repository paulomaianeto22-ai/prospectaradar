<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ProspectaRadar</title>
<style>
:root{--roxo:#5B1FA0;--roxod:#43167A;--laranja:#F97316;--luz:#F5F1FB;--linha:#E6DFF2;--ink:#1F2733;--muted:#6b7280;--verde:#2e7d32}
*{box-sizing:border-box;margin:0;font-family:Segoe UI,system-ui,sans-serif}
body{background:var(--luz);color:var(--ink)}
.top{background:linear-gradient(120deg,var(--roxod),var(--roxo));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--laranja);box-shadow:0 0 0 4px rgba(249,115,22,.3)}
.nav a{color:#e9def7;text-decoration:none;margin-left:18px;font-size:.92rem}
.nav a:hover{color:#fff}
.pill{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:999px;font-size:.85rem}
.wrap{max-width:1080px;margin:26px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(67,22,122,.06)}
h1{color:var(--roxod);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--linha);border-radius:10px;font-size:1rem}
.btn{background:var(--laranja);color:#fff;border:none;padding:13px 24px;border-radius:999px;font-weight:700;font-size:1rem;cursor:pointer;margin-top:16px}
.btn:hover{filter:brightness(1.05)}
.btn.sm{padding:8px 16px;font-size:.85rem;margin:0}
.erro{background:#fce4e4;color:#c0392b;padding:10px 14px;border-radius:10px;margin-bottom:12px}
a.link{color:var(--roxo);font-weight:600;text-decoration:none}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:10px}
th{background:var(--roxod);color:#fff;text-align:left;padding:10px}
td{border-top:1px solid var(--linha);padding:10px;vertical-align:top}
.tag{display:inline-block;background:var(--luz);color:var(--roxod);border-radius:999px;padding:2px 10px;font-size:.78rem}
.status-fechou{color:var(--verde);font-weight:700}
</style></head><body>
<div class="top">
  <div class="brand"><span class="dot"></span>ProspectaUP · Radar</div>
  <div class="nav">
    {% if u %}<span class="pill">{{ restantes if restantes is defined else '' }}{% if restantes is defined %} leads restantes{% endif %}</span>
      <a href="/pedir">Pedir leads</a><a href="/historico">Histórico</a>{% if u.is_admin %}<a href="/admin">Admin</a>{% endif %}<a href="/logout">Sair</a>
    {% else %}<a href="/login">Entrar</a><a href="/cadastro">Criar conta</a>{% endif %}
  </div>
</div>
<div class="wrap">{% block conteudo %}{% endblock %}</div>
</body></html>
