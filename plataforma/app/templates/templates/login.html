{% extends "base.html" %}{% block conteudo %}
<div class="card" style="max-width:420px;margin:40px auto">
<h1>Entrar</h1><p class="sub">Acesse sua conta.</p>
{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
<form method="post">
<label>Email</label><input name="email" type="email" required>
<label>Senha</label><input name="senha" type="password" required>
<button class="btn" style="width:100%">Entrar</button></form>
<p style="margin-top:16px">Não tem conta? <a class="link" href="/cadastro">Criar conta</a></p>
</div>{% endblock %}
