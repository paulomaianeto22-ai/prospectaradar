<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProspectaUP · Lead Viewer</title>
<style>
  :root{--purple:#5B1FA0;--purple-d:#43167a;--orange:#F97316;--ink:#1f2733;
    --muted:#6b7280;--line:#e6dff2;--soft:#f5f1fb;--green:#2e7d32;--red:#c0392b;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#faf8fe;color:var(--ink)}
  .top{background:linear-gradient(120deg,var(--purple-d),var(--purple));color:#fff;padding:20px 28px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;font-size:1.4rem;font-weight:800;letter-spacing:.3px}
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px rgba(249,115,22,.3)}
  .brand small{font-weight:400;opacity:.8;font-size:.8rem;display:block;letter-spacing:0}
  .topbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600}
  .wrap{max-width:1320px;margin:0 auto;padding:22px}
  #drop{border:2.5px dashed var(--purple);border-radius:16px;background:#fff;padding:40px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:20px}
  #drop.hover{background:var(--soft);border-color:var(--orange)}
  #drop h2{color:var(--purple-d);margin-bottom:8px;font-size:1.25rem}
  #drop p{color:var(--muted)}
  #drop .btn{display:inline-block;margin-top:14px;background:var(--orange);color:#fff;padding:11px 24px;border-radius:999px;font-weight:600;font-size:.95rem}
  .recentes{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
  .rec-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--purple-d);padding:14px 20px;font-size:1.05rem;border-bottom:1px solid var(--line)}
  .rec-head button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.82rem}
  .rec-head button:hover{color:var(--red)}
  .rec-item{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer;border-bottom:1px solid #f4f0fc}
  .rec-item:last-child{border-bottom:none} .rec-item:hover{background:var(--soft)}
  .rec-ic{width:34px;height:34px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1.1rem}
  .rec-main{flex:1;min-width:0} .rec-main b{display:block;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec-main span{color:var(--muted);font-size:.82rem} .rec-date{color:var(--muted);font-size:.85rem;white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .stat b{display:block;font-size:2rem;color:var(--purple-d);font-weight:800;line-height:1}
  .stat.acc b{color:var(--orange)} .stat.done b{color:var(--green)} .stat span{color:var(--muted);font-size:.85rem}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .controls input,.controls select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff}
  .controls input[type=search]{flex:1;min-width:180px}
  .controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.9rem;cursor:pointer}
  .share{background:var(--orange);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.9rem}
  .share:hover{background:#fb8b3c}
  .count{color:var(--muted);font-size:.9rem;margin-left:auto}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:66vh}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th{position:sticky;top:0;background:var(--purple-d);color:#fff;padding:11px 12px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;font-weight:600}
  th.nosort{cursor:default} th:hover:not(.nosort){background:var(--purple)} th .arrow{opacity:.5;font-size:.7rem}
  td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;max-width:360px}
  tr:hover td{background:var(--soft)} tr.done td{background:#eef8ee!important;opacity:.6} tr.done td.namecol{text-decoration:line-through}
  td.email-yes{color:var(--green);font-weight:600} td.email-no{color:var(--red)}
  td.chk{text-align:center;width:44px} td.chk input{width:18px;height:18px;cursor:pointer;accent-color:var(--green)} th.chk{width:44px;text-align:center}
  .pill{display:inline-block;background:var(--soft);color:var(--purple-d);border-radius:999px;padding:3px 10px;font-size:.78rem;margin:1px}
  a{color:var(--purple);text-decoration:none} a:hover{text-decoration:underline}
  .body-cell{font-size:.8rem;color:var(--muted);white-space:pre-wrap;max-height:60px;overflow:hidden;cursor:pointer} .body-cell.expanded{max-height:none}
  .hidden{display:none}
  .foot{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
  .reset{background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:.85rem}
  .reset:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot"></span><div>ProspectaUP · Radar<small>Visualizador de leads</small></div></div>
  <button class="topbtn" onclick="showDrop()">Abrir outro arquivo</button>
</div>

<div class="wrap">
  <div id="drop-screen">
    <div id="drop">
      <h2>Arraste um arquivo de leads aqui</h2>
      <p>Qualquer CSV da sua pasta Prospecta_Leads (clínicas, fazendas, agências…)</p>
      <span class="btn">Escolher arquivo</span>
      <input type="file" id="file" accept=".csv" class="hidden">
    </div>
    <div class="recentes hidden" id="recentes"></div>
  </div>

  <div id="dash" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input type="search" id="q" placeholder="🔎 Buscar…">
      <select id="filter"><option value="">Todos</option></select>
      <label><input type="checkbox" id="onlyEmail"> Só com email</label>
      <label><input type="checkbox" id="hideDone"> Ocultar já acessados</label>
      <button class="share" onclick="gerarCompartilhavel()">📤 Compartilhar (gerar página)</button>
      <button class="reset" onclick="limparMarcas()">Limpar marcações</button>
      <span class="count" id="count"></span>
    </div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
</div>
<div class="foot">ProspectaUP · Radar — 100% offline. Marcações e histórico ficam salvos no seu navegador.</div>

<script>
let COLS=[], DATA=[], view=[], sortCol=null, sortDir=1, filterCol=null, fileName='', done=new Set();

function parseCSV(text){
  const rows=[]; let i=0,f='',row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i+=2;continue;} q=false;i++;continue;} f+=c;i++;continue;}
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(f);f='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(f);rows.push(row);row=[];f='';i++;continue;}
    f+=c;i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function getHistory(){try{return JSON.parse(localStorage.getItem('leadviewer::history')||'[]');}catch(e){return[];}}
function saveHistory(h){try{localStorage.setItem('leadviewer::history',JSON.stringify(h));}catch(e){}}
function addHistory(name,content,count){let h=getHistory().filter(x=>x.name!==name);h.unshift({name,content,count,date:Date.now()});saveHistory(h.slice(0,15));}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function renderHistory(){
  const h=getHistory(); const el=document.getElementById('recentes');
  if(!h.length){el.classList.add('hidden');return;} el.classList.remove('hidden');
  el.innerHTML='<div class="rec-head"><span>Recentes</span><button onclick="clearHistory()">Limpar histórico</button></div>'+
    h.map((x,i)=>`<div class="rec-item" onclick="openHistory(${i})"><div class="rec-ic">📄</div><div class="rec-main"><b>${escapeHtml(x.name)}</b><span>${x.count} leads</span></div><div class="rec-date">${fmtDate(x.date)}</div></div>`).join('');
}
function openHistory(i){const x=getHistory()[i];if(x)load(x.content,x.name);}
function clearHistory(){if(confirm('Limpar o histórico de arquivos abertos?')){saveHistory([]);renderHistory();}}
function showDrop(){document.getElementById('dash').classList.add('hidden');document.getElementById('drop-screen').classList.remove('hidden');renderHistory();}

function storageKey(){return 'leadviewer::done::'+fileName;}
function loadDone(){done=new Set();try{const s=localStorage.getItem(storageKey());if(s)done=new Set(JSON.parse(s));}catch(e){}}
function saveDone(){try{localStorage.setItem(storageKey(),JSON.stringify([...done]));}catch(e){}}
function rowKey(d){return COLS.map(c=>d[c]).join('|§|');}

function load(text, name){
  fileName=name||'arquivo';
  const rows=parseCSV(text).filter(r=>r.some(c=>c.trim()!==''));
  if(!rows.length)return;
  COLS=rows[0]; DATA=rows.slice(1).map(r=>{const o={};COLS.forEach((c,i)=>o[c]=r[i]||'');return o;});
  loadDone(); addHistory(fileName,text,DATA.length);
  const pref=['problema','status','country','estado','cidade','city','encontrado_via'];
  filterCol=pref.find(p=>COLS.some(c=>c.toLowerCase()===p))||null;
  if(filterCol) filterCol=COLS.find(c=>c.toLowerCase()===filterCol);
  buildFilter(); buildHead(); apply();
  document.getElementById('drop-screen').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
}
function emailCol(){return COLS.find(c=>c.toLowerCase().includes('email'));}
function nameCol(){return COLS.find(c=>/empresa|company|nome/i.test(c))||COLS[0];}
function isEmail(v){v=(v||'').trim();return v && v.includes('@');}
function buildFilter(){
  const sel=document.getElementById('filter'); sel.innerHTML='<option value="">Todos</option>';
  if(!filterCol){sel.classList.add('hidden');return;} sel.classList.remove('hidden');
  [...new Set(DATA.map(d=>d[filterCol]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=(v.length>40?v.slice(0,40)+'…':v);sel.appendChild(o);});
}
function buildHead(){
  const tr=document.createElement('tr');
  const thc=document.createElement('th');thc.className='chk nosort';thc.textContent='✓';tr.appendChild(thc);
  COLS.forEach(c=>{const th=document.createElement('th');th.innerHTML=labelize(c)+' <span class="arrow">↕</span>';
    th.onclick=()=>{sortDir=(sortCol===c)?-sortDir:1;sortCol=c;apply();};tr.appendChild(th);});
  const h=document.getElementById('thead');h.innerHTML='';h.appendChild(tr);
}
function labelize(c){return c.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase());}
function apply(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const fv=document.getElementById('filter').value;
  const oe=document.getElementById('onlyEmail').checked;
  const hd=document.getElementById('hideDone').checked;
  const ec=emailCol();
  view=DATA.filter(d=>{
    if(q && !COLS.some(c=>(d[c]||'').toLowerCase().includes(q)))return false;
    if(fv && d[filterCol]!==fv)return false;
    if(oe && ec && !isEmail(d[ec]))return false;
    if(hd && done.has(rowKey(d)))return false;
    return true;
  });
  if(sortCol){view.sort((a,b)=>{let x=a[sortCol]||'',y=b[sortCol]||'';const nx=parseFloat(x),ny=parseFloat(y);
    if(!isNaN(nx)&&!isNaN(ny))return (nx-ny)*sortDir;return x.localeCompare(y,'pt')*sortDir;});}
  render();
}
function toggleDone(key,tr){if(done.has(key)){done.delete(key);tr.classList.remove('done');}else{done.add(key);tr.classList.add('done');}saveDone();updateStats();}
function render(){
  const ec=emailCol(), nc=nameCol();
  const tb=document.getElementById('tbody');tb.innerHTML='';
  view.forEach(d=>{const tr=document.createElement('tr');const key=rowKey(d);
    if(done.has(key))tr.classList.add('done');
    const tdc=document.createElement('td');tdc.className='chk';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=done.has(key);cb.onchange=()=>toggleDone(key,tr);tdc.appendChild(cb);tr.appendChild(tdc);
    COLS.forEach(c=>{const td=document.createElement('td');const v=d[c]||'';const lc=c.toLowerCase();
      if(c===nc)td.className='namecol';
      if(lc.includes('email')){td.className=(isEmail(v)?'email-yes':'email-no');td.textContent=v||'—';}
      else if(lc.includes('website')||(lc.includes('site')&&v.startsWith('http'))){td.innerHTML=v?`<a href="${v}" target="_blank">${v.replace(/^https?:\/\//,'').slice(0,34)}</a>`:'—';}
      else if(lc.includes('instagram')){td.innerHTML=v?`<a href="${v}" target="_blank">Instagram</a>`:'—';}
      else if(lc==='problema'||lc==='status'){td.innerHTML=v.split(',').map(pp=>`<span class="pill">${escapeHtml(pp.trim())}</span>`).join(' ');}
      else if(lc==='body'||lc==='subject'){td.innerHTML=`<div class="body-cell" onclick="this.classList.toggle('expanded')">${escapeHtml(v)}</div>`;}
      else td.textContent=v||'—';
      tr.appendChild(td);});
    tb.appendChild(tr);});
  updateStats();
}
function updateStats(){
  const ec=emailCol();
  const total=DATA.length, comEmail=ec?DATA.filter(d=>isEmail(d[ec])).length:0;
  const acessados=DATA.filter(d=>done.has(rowKey(d))).length;
  document.getElementById('stats').innerHTML=
    `<div class="stat"><b>${total}</b><span>leads no arquivo</span></div>`+
    (ec?`<div class="stat acc"><b>${comEmail}</b><span>com email (${Math.round(comEmail/total*100)}%)</span></div>`:'')+
    `<div class="stat done"><b>${acessados}</b><span>já acessados</span></div>`+
    `<div class="stat"><b>${total-acessados}</b><span>faltam</span></div>`;
  document.getElementById('count').textContent=`${view.length} de ${total}`;
}
function limparMarcas(){if(!confirm('Desmarcar TODOS os leads já acessados deste arquivo?'))return;done=new Set();saveDone();apply();}
function escapeHtml(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ============ COMPARTILHAR: gera página autônoma pra enviar ============ */
const SHARE_CSS='*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif}body{background:#faf8fe;color:#1f2733}'
+'.top{background:linear-gradient(120deg,#43167a,#5B1FA0);color:#fff;padding:18px 26px;display:flex;align-items:center;gap:12px}'
+'.dot{width:13px;height:13px;border-radius:50%;background:#F97316;box-shadow:0 0 0 5px rgba(249,115,22,.3)}'
+'.top b{font-size:1.3rem;font-weight:800}.top small{opacity:.85;font-size:.8rem;display:block}'
+'.wrap{max-width:1200px;margin:0 auto;padding:20px}.bar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}'
+'#q{flex:1;min-width:200px;padding:10px 14px;border:1px solid #e6dff2;border-radius:10px}'
+'.cnt{color:#6b7280;font-size:.9rem}.dn{color:#2e7d32;font-weight:700}'
+'.tw{background:#fff;border:1px solid #e6dff2;border-radius:14px;overflow:auto;max-height:80vh}'

+'td{padding:10px 12px;border-top:1px solid #eee;vertical-align:top;max-width:340px}tr:hover td{background:#f5f1fb}'
+'tr.done td{background:#eef8ee!important;opacity:.55}tr.done td.nm{text-decoration:line-through}'
+'td.chk{text-align:center;width:44px}td.chk input{width:18px;height:18px;accent-color:#2e7d32;cursor:pointer}'
+'.ok{color:#2e7d32;font-weight:600}.pill{display:inline-block;background:#f5f1fb;color:#43167a;border-radius:999px;padding:3px 10px;font-size:.78rem;margin:1px}'
+'a{color:#5B1FA0;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}.nm{font-weight:600}'
+'.foot{text-align:center;color:#6b7280;font-size:.8rem;padding:18px}';

const SHARE_JS='function esc(s){return(s||"").replace(/[&<>]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[m];});}'
+'function isEmail(v){v=(v||"").trim();return v&&v.indexOf("@")>-1;}'
+'var NC=COLS.filter(function(c){return /empresa|company|nome/i.test(c);})[0]||COLS[0];'
+'var KEY="sharedleads::"+TITLE;var done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}'

+'function render(){var q=(document.getElementById("q").value||"").toLowerCase();'
+'var rows=DADOS.filter(function(d){return !q||COLS.some(function(c){return (d[c]||"").toLowerCase().indexOf(q)>-1;});});var h="";'
+'rows.forEach(function(d){var k=rk(d),dn=!!done[k];h+="<tr class=\\""+(dn?"done":"")+"\\"><td class=\\"chk\\"><input type=\\"checkbox\\" data-k=\\""+esc(k).replace(/"/g,"&quot;")+"\\" "+(dn?"checked":"")+"></td>";'

+'if(lc.indexOf("email")>-1)cell=isEmail(v)?("<span class=\\"ok\\">"+esc(v)+"</span>"):"\\u2014";'
+'else if(lc.indexOf("instagram")>-1)cell=v?("<a href=\\""+esc(v)+"\\" target=\\"_blank\\">Instagram \\u2197</a>"):"\\u2014";'
+'else if(lc.indexOf("website")>-1||(lc.indexOf("site")>-1&&v.indexOf("http")===0))cell=v?("<a href=\\""+esc(v)+"\\" target=\\"_blank\\">"+esc(v.replace(/^https?:\\/\\//,"").slice(0,30))+" \\u2197</a>"):"\\u2014";'
+'else if(lc==="problema"||lc==="status")cell=v.split(",").map(function(p){return "<span class=\\"pill\\">"+esc(p.trim())+"</span>";}).join(" ");'
+'else cell=esc(v)||"\\u2014";h+="<td"+(c===NC?" class=\\"nm\\"":"")+">"+cell+"</td>";});h+="</tr>";});'
+'document.getElementById("tb").innerHTML=h;document.getElementById("cnt").textContent=rows.length+" de "+DADOS.length;'
+'document.getElementById("dn").textContent=Object.keys(done).length;}'

+'render();';

function gerarCompartilhavel(){
  const titulo = fileName.replace(/\.csv$/i,'');
  const colsJson = JSON.stringify(COLS).replace(/</g,'\\u003c');
  const dataJson = JSON.stringify(DATA).replace(/</g,'\\u003c');
  const body =
    '<div class="top"><span class="dot"></span><div><b>ProspectaUP · Radar</b><small>'+escapeHtml(titulo)+'</small></div></div>'
    +'<div class="wrap"><div class="bar"><input id="q" placeholder="\u{1F50E} Buscar..."><span class="cnt" id="cnt"></span><span>Lidos: <b class="dn" id="dn">0</b></span></div>'
    +'<div class="tw"><table><thead id="thead"></thead><tbody id="tb"></tbody></table></div></div>'
    +'<div class="foot">Leads gerados por ProspectaUP · Radar \u2014 marque os que já contatou; suas marcações ficam salvas neste navegador.</div>';
  const html='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+escapeHtml(titulo)+' \u2014 Leads</title><style>'+SHARE_CSS+'</style></head><body>'+body
    +'<scr'+'ipt>var COLS='+colsJson+';var DADOS='+dataJson+';var TITLE='+JSON.stringify(titulo)+';'+SHARE_JS+'</scr'+'ipt></body></html>';
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Leads_'+titulo.replace(/[^\w\-]+/g,'_')+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

['q','filter','onlyEmail','hideDone'].forEach(id=>document.getElementById(id).addEventListener('input',apply));
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f,'utf-8');});
const dz=document.getElementById('drop');
dz.onclick=()=>document.getElementById('file').click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('hover');};
dz.ondragleave=()=>dz.classList.remove('hover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('hover');const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f,'utf-8');}};
renderHistory();
</script>
</body>
</html>
